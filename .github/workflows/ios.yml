name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass النيتيف محتاج Xcode 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS project and add packages
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Shaghal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Shaghal-ipa
          path: app/Shaghal.ipa
