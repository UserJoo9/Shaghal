name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass النيتيف محتاج Xcode 26 SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS project and add packages
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      # تشخيص: هل الزجاج النيتيف (UIGlassEffect) اتبنى فعلاً جوّه التطبيق؟
      - name: Diagnose Liquid Glass support
        working-directory: app
        run: |
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          found=0
          for f in build/ios/iphoneos/Runner.app/Frameworks/*.framework; do
            b="$f/$(basename "$f" .framework)"
            if strings "$b" 2>/dev/null | grep -q UIGlassEffect; then
              echo "UIGlassEffect FOUND in $b"; found=1
            fi
          done
          if [ "$found" = "0" ]; then echo "UIGlassEffect NOT FOUND in any framework"; fi

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Shaghal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Shaghal-ipa
          path: app/Shaghal.ipa
